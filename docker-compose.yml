services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator
    ports:
      # Host port is configurable (POSTGRES_HOST_PORT in .env) for machines where 5432 is taken.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full application from the root Dockerfile (API + built frontend, migrations on start):
  #   docker compose up -d --build   -> http://localhost:8000
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/orchestrator
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      COOKIE_SECURE: "false"
    ports:
      # Host port is configurable (APP_HOST_PORT in .env) for machines where 8000 is taken.
      - "${APP_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Backend dev environment in Linux: no Python needed on the host (and no clash with
  # Windows Smart App Control, which blocks native wheels like pydantic_core).
  #   docker compose --profile dev up backend          -> API with hot reload on :8000
  #   docker compose run --rm backend sh check.sh      -> all backend quality gates
  backend:
    profiles: ["dev"]
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/orchestrator
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
      COOKIE_SECURE: "false"
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - backend-venv:/opt/venv
      - uv-cache:/root/.cache/uv
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "uv sync --locked &&
             uv run alembic upgrade head &&
             uv run python -m app.auth.demo_accounts &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  db-data:
  backend-venv:
  uv-cache:
