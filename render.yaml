# Render Blueprint: one free Docker web service built from the root Dockerfile.
# The database is Supabase (free), connected through its session pooler; the URL is
# entered in the Render Dashboard when the Blueprint is created, never stored here.
services:
  - type: web
    name: sales-order-orchestrator
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy only after the GitHub Actions checks on main pass.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    # PORT is set by Render; backend/start.sh binds uvicorn to ${PORT:-8000}.
    envVars:
      - key: DATABASE_URL
        sync: false
      # Shared password of the demo accounts. Render asks for sync: false values only
      # when a Blueprint is created; for the existing service set it manually in the
      # Dashboard (Environment), then restart. COOKIE_SECURE stays unset (default true).
      - key: DEMO_PASSWORD
        sync: false
      # Inquiry analysis through Groq (default model openai/gpt-oss-120b).
      - key: LLM_PROVIDER
        value: groq
      # Groq API key (console.groq.com). Like DEMO_PASSWORD: Render asks for sync: false
      # values only when a Blueprint is created; for the existing service set it in the
      # Dashboard (Environment) or through the Render API, then restart. Never stored here.
      - key: LLM_API_KEY
        sync: false
