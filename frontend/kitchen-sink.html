<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitchen sink · Sales Order Orchestrator</title>
    <!-- Theme before the first paint (no flash); the same rules as src/theme.ts. -->
    <script>
      try {
        var choice = localStorage.getItem('theme')
        var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <!-- Dev only (npm run dev → /kitchen-sink.html). Not in build.rollupOptions.input, so not built. -->
    <div id="root"></div>
    <script type="module" src="/src/kitchen-sink.tsx"></script>
  </body>
</html>
